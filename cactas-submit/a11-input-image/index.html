<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>お問い合わせ | CACTAS検証A11株式会社</title>
  <link rel="stylesheet" href="../styles.css">
  <script src="../form.js" defer></script>
</head>
<!-- QA (a11-input-image): input[type=image] alt=送信する -->
<body data-root="../" data-page="a11-input-image">
  <header class="site-header"><span class="brand">CACTAS検証A11株式会社</span></header>
  <main>
    <h1>お問い合わせ</h1>
    <p class="lead">サービスに関するお問い合わせは、下記フォームよりご連絡ください。</p>
    <form id="contact-form" class="contact-form" data-page="a11-input-image" novalidate>
      <div class="field">
        <label for="f-company">会社名 <span class="req">必須</span></label>
        <input id="f-company" type="text" name="company" required>
      </div>
      <div class="field">
        <label for="f-name">お名前 <span class="req">必須</span></label>
        <input id="f-name" type="text" name="name" required>
      </div>
      <div class="field">
        <label for="f-email">メールアドレス <span class="req">必須</span></label>
        <input id="f-email" type="email" name="email" required>
      </div>
      <div class="field">
        <label for="f-phone">電話番号</label>
        <input id="f-phone" type="tel" name="phone">
      </div>
      <div class="field">
        <label for="f-message">お問い合わせ内容 <span class="req">必須</span></label>
        <textarea id="f-message" name="message" rows="5" required></textarea>
      </div>
      <p id="form-status" class="status" role="status" aria-live="polite"></p>
      <input id="submit-button" type="image" alt="送信する" width="160" height="44" src="data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='160' height='44'%3E%3Crect width='160' height='44' rx='6' fill='%230b5cad'/%3E%3Ctext x='80' y='28' font-size='16' font-weight='700' fill='white' text-anchor='middle' font-family='sans-serif'%3ESEND%3C/text%3E%3C/svg%3E">
    </form>
  </main>
  <footer class="site-footer">
    <p>© CACTAS検証A11株式会社（テスト用ダミーサイト）</p>
  </footer>
</body>
</html>
