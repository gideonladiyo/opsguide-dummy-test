<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>メールマガジン登録</title>
  <link rel="stylesheet" href="../styles.css">
  <script src="../form.js" defer></script>
</head>
<!-- QA: halaman ini berarti tombol 登録する (newsletter footer) yang terklik, BUKAN tombol kirim form kontak. -->
<body data-root="../" data-page="newsletter">
  <header class="site-header"><span class="brand">メールマガジン</span></header>
  <main>
    <h1>メールマガジン登録を受け付けました</h1>
    <section class="thanks">
      <p>ご登録ありがとうございます。（お問い合わせは送信されていません）</p>
      <p id="verdict" class="verdict"></p>
      <table>
        <tbody>
          <tr><th>ページ</th><td data-param="page"></td></tr>
          <tr><th>クリックされた要素</th><td data-param="btn"></td></tr>
        </tbody>
      </table>
    </section>
  </main>
</body>
</html>
