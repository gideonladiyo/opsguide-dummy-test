<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>お問い合わせ | CACTAS検証B03株式会社</title>
  <link rel="stylesheet" href="../styles.css">
  <script src="../form.js" defer></script>
</head>
<!-- QA (b03-loading-overlay): overlay transparan 8 detik setelah load -->
<body data-root="../" data-page="b03-loading-overlay">
  <header class="site-header"><span class="brand">CACTAS検証B03株式会社</span></header>
  <main>
    <h1>お問い合わせ</h1>
    <p class="lead">サービスに関するお問い合わせは、下記フォームよりご連絡ください。</p>
    <form id="contact-form" class="contact-form" data-page="b03-loading-overlay" novalidate>
      <div class="field">
        <label for="f-company">会社名 <span class="req">必須</span></label>
        <input id="f-company" type="text" name="company" required>
      </div>
      <div class="field">
        <label for="f-name">お名前 <span class="req">必須</span></label>
        <input id="f-name" type="text" name="name" required>
      </div>
      <div class="field">
        <label for="f-email">メールアドレス <span class="req">必須</span></label>
        <input id="f-email" type="email" name="email" required>
      </div>
      <div class="field">
        <label for="f-phone">電話番号</label>
        <input id="f-phone" type="tel" name="phone">
      </div>
      <div class="field">
        <label for="f-message">お問い合わせ内容 <span class="req">必須</span></label>
        <textarea id="f-message" name="message" rows="5" required></textarea>
      </div>
      <p id="form-status" class="status" role="status" aria-live="polite"></p>
      <button id="submit-button" type="submit">送信する</button>
    </form>
  </main>
  <div id="loading-overlay" class="loading-overlay" data-remove-after="8000" aria-hidden="true"><span class="spinner"></span></div>
  <footer class="site-footer">
    <p>© CACTAS検証B03株式会社（テスト用ダミーサイト）</p>
  </footer>
</body>
</html>
