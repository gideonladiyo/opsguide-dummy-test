<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>お問い合わせ | CACTAS検証A14株式会社</title>
  <link rel="stylesheet" href="../styles.css">
  <script src="../form.js" defer></script>
</head>
<!-- QA (a14-multi-form): form 検索 di header &amp; 登録する di footer -->
<body data-root="../" data-page="a14-multi-form">
  <header class="site-header"><span class="brand">CACTAS検証A14株式会社</span>
    <form id="search-form" class="search-form" data-kind="search" role="search">
      <input type="text" name="q" aria-label="サイト内検索" placeholder="サイト内検索">
      <button id="search-button" type="submit">検索</button>
    </form></header>
  <main>
    <h1>お問い合わせ</h1>
    <p class="lead">サービスに関するお問い合わせは、下記フォームよりご連絡ください。</p>
    <form id="contact-form" class="contact-form" data-page="a14-multi-form" novalidate>
      <div class="field">
        <label for="f-company">会社名 <span class="req">必須</span></label>
        <input id="f-company" type="text" name="company" required>
      </div>
      <div class="field">
        <label for="f-name">お名前 <span class="req">必須</span></label>
        <input id="f-name" type="text" name="name" required>
      </div>
      <div class="field">
        <label for="f-email">メールアドレス <span class="req">必須</span></label>
        <input id="f-email" type="email" name="email" required>
      </div>
      <div class="field">
        <label for="f-phone">電話番号</label>
        <input id="f-phone" type="tel" name="phone">
      </div>
      <div class="field">
        <label for="f-message">お問い合わせ内容 <span class="req">必須</span></label>
        <textarea id="f-message" name="message" rows="5" required></textarea>
      </div>
      <p id="form-status" class="status" role="status" aria-live="polite"></p>
      <button id="submit-button" type="submit">送信する &gt;</button>
    </form>
  </main>
  <footer class="site-footer">
    <form id="newsletter-form" class="newsletter-form" data-kind="newsletter">
      <label for="nl-email">メールマガジン登録</label>
      <input id="nl-email" type="email" name="nl_email" placeholder="メールアドレス">
      <input id="newsletter-button" type="submit" value="登録する">
    </form>
    <p>© CACTAS検証A14株式会社（テスト用ダミーサイト）</p>
  </footer>
</body>
</html>
