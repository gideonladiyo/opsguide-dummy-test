<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>送信完了 | お問い合わせ</title>
  <link rel="stylesheet" href="../styles.css">
  <script src="../form.js" defer></script>
</head>
<body data-root="../" data-page="thanks" data-event="submit">
  <header class="site-header"><span class="brand">お問い合わせ</span></header>
  <main>
    <h1>送信が完了しました</h1>
    <section class="thanks">
      <p>お問い合わせありがとうございました。担当者より折り返しご連絡いたします。（テスト用ページのため、データは保存されません）</p>
      <p id="verdict" class="verdict"></p>
      <table>
        <tbody>
          <tr><th>ページ</th><td data-param="page"></td></tr>
          <tr><th>クリックされた要素</th><td data-param="btn"></td></tr>
          <tr><th>ボタンの文言</th><td data-param="label"></td></tr>
          <tr><th>アクセス元IP</th><td id="client-ip">確認中…</td></tr>
        </tbody>
      </table>
    </section>
  </main>
  <footer class="site-footer">テスト用ダミーサイト</footer>
</body>
</html>
