<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>お見積り依頼 | 検証テスト工業株式会社</title>
  <link rel="stylesheet" href="../styles.css">
  <script src="../form.js" defer></script>
</head>
<body>
  <header class="site-header"><span class="brand">検証テスト工業株式会社</span></header>
  <main>
    <h1>お見積り依頼</h1>
    <p class="lead">製品のお見積りをご希望の方はこちらからご依頼ください。</p>
    <form id="contact-form" data-page="good-02" novalidate>
      <div class="field">
        <label for="f-company">会社名 <span class="req">必須</span></label>
        <input id="f-company" type="text" name="company" required>
      </div>
      <div class="field">
        <label for="f-department">部署名</label>
        <input id="f-department" type="text" name="department">
      </div>
      <div class="field">
        <label for="f-name">ご担当者名 <span class="req">必須</span></label>
        <input id="f-name" type="text" name="name" required>
      </div>
      <div class="field">
        <label for="f-email">メールアドレス <span class="req">必須</span></label>
        <input id="f-email" type="email" name="email" required>
      </div>
      <div class="field">
        <label for="f-product">ご希望の製品 <span class="req">必須</span></label>
        <select id="f-product" name="product" required><option value="">選択してください</option><option value="標準モデル">標準モデル</option><option value="業務用モデル">業務用モデル</option><option value="カスタム">カスタム</option></select>
      </div>
      <div class="field">
        <label for="f-detail">ご要望・詳細 <span class="req">必須</span></label>
        <textarea id="f-detail" name="detail" rows="5" required></textarea>
      </div>
      <p id="form-status" class="status" role="status" aria-live="polite"></p>
      <button id="submit-button" type="submit">送信する</button>
    </form>
    <section id="thanks" class="thanks" hidden>
      <h2>送信が完了しました</h2>
      <p>お問い合わせありがとうございました。（テスト用ページのため、データは保存されません）</p>
    </section>
  </main>
  <footer class="site-footer">© 検証テスト工業株式会社（テスト用ダミーサイト）</footer>
</body>
</html>
