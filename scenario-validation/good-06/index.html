<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>採用に関するお問い合わせ | 検証テスト建設株式会社</title>
  <link rel="stylesheet" href="../styles.css">
  <script src="../form.js" defer></script>
</head>
<body>
  <header class="site-header"><span class="brand">検証テスト建設株式会社</span></header>
  <main>
    <h1>採用に関するお問い合わせ</h1>
    <p class="lead">採用・募集要項についてのお問い合わせはこちらから。</p>
    <form id="contact-form" data-page="good-06" novalidate>
      <div class="field">
        <label for="f-name">お名前 <span class="req">必須</span></label>
        <input id="f-name" type="text" name="name" required>
      </div>
      <div class="field">
        <label for="f-kana">フリガナ <span class="req">必須</span></label>
        <input id="f-kana" type="text" name="kana" required>
      </div>
      <div class="field">
        <label for="f-email">メールアドレス <span class="req">必須</span></label>
        <input id="f-email" type="email" name="email" required>
      </div>
      <div class="field">
        <label for="f-phone">電話番号 <span class="req">必須</span></label>
        <input id="f-phone" type="tel" name="phone" required>
      </div>
      <div class="field">
        <label for="f-position">ご興味のある職種 <span class="req">必須</span></label>
        <select id="f-position" name="position" required><option value="">選択してください</option><option value="施工管理">施工管理</option><option value="設計">設計</option><option value="営業">営業</option><option value="事務">事務</option></select>
      </div>
      <div class="field">
        <label for="f-message">お問い合わせ内容 <span class="req">必須</span></label>
        <textarea id="f-message" name="message" rows="5" required></textarea>
      </div>
      <p id="form-status" class="status" role="status" aria-live="polite"></p>
      <button id="submit-button" type="submit">送信する</button>
    </form>
    <section id="thanks" class="thanks" hidden>
      <h2>送信が完了しました</h2>
      <p>お問い合わせありがとうございました。（テスト用ページのため、データは保存されません）</p>
    </section>
  </main>
  <footer class="site-footer">© 検証テスト建設株式会社（テスト用ダミーサイト）</footer>
</body>
</html>
