<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>セミナー申込 | 検証テストソリューションズ株式会社</title>
  <link rel="stylesheet" href="../styles.css">
  <script src="../form.js" defer></script>
</head>
<body>
  <header class="site-header"><span class="brand">検証テストソリューションズ株式会社</span></header>
  <main>
    <h1>セミナー申込</h1>
    <p class="lead">オンラインセミナーへの参加申込フォームです。</p>
    <form id="contact-form" data-page="good-03" novalidate>
      <div class="field">
        <label for="f-company">会社名 <span class="req">必須</span></label>
        <input id="f-company" type="text" name="company" required>
      </div>
      <div class="field">
        <label for="f-name">お名前 <span class="req">必須</span></label>
        <input id="f-name" type="text" name="name" required>
      </div>
      <div class="field">
        <label for="f-email">メールアドレス <span class="req">必須</span></label>
        <input id="f-email" type="email" name="email" required>
      </div>
      <div class="field">
        <label for="f-session">参加希望日程 <span class="req">必須</span></label>
        <select id="f-session" name="session" required><option value="">選択してください</option><option value="12月1日 10:00">12月1日 10:00</option><option value="12月8日 14:00">12月8日 14:00</option><option value="12月15日 16:00">12月15日 16:00</option></select>
      </div>
      <div class="field checkbox">
        <label for="f-agree"><input id="f-agree" type="checkbox" name="agree" value="yes" required> 個人情報の取り扱いに同意する <span class="req">必須</span></label>
      </div>
      <p id="form-status" class="status" role="status" aria-live="polite"></p>
      <button id="submit-button" type="submit">送信する</button>
    </form>
    <section id="thanks" class="thanks" hidden>
      <h2>送信が完了しました</h2>
      <p>お問い合わせありがとうございました。（テスト用ページのため、データは保存されません）</p>
    </section>
  </main>
  <footer class="site-footer">© 検証テストソリューションズ株式会社（テスト用ダミーサイト）</footer>
</body>
</html>
