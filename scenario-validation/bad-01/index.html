<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>メールマガジン登録 | 検証テスト通信株式会社</title>
  <link rel="stylesheet" href="../styles.css">
  <script src="../form.js" defer></script>
</head>
<body>
  <header class="site-header"><span class="brand">検証テスト通信株式会社</span></header>
  <main>
    <h1>メールマガジン登録</h1>
    <p class="lead">メールアドレスのみで登録できます。</p>
    <form id="contact-form" data-page="bad-01" novalidate>
      <div class="field">
        <label for="f-email">メールアドレス <span class="req">必須</span></label>
        <input id="f-email" type="email" name="email" required>
      </div>
      <p id="form-status" class="status" role="status" aria-live="polite"></p>
      <button id="submit-button" type="submit">送信する</button>
    </form>
    <section id="thanks" class="thanks" hidden>
      <h2>送信が完了しました</h2>
      <p>お問い合わせありがとうございました。（テスト用ページのため、データは保存されません）</p>
    </section>
  </main>
  <footer class="site-footer">© 検証テスト通信株式会社（テスト用ダミーサイト）</footer>
</body>
</html>
