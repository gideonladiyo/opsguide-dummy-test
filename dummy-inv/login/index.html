<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Halaman decoy login untuk pengujian sanitize URL.">
  <title>Sign in</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <main class="shell">
    <a class="back-link" href="../">← Semua project</a>
    <p class="eyebrow">SIGN_IN</p>
    <h1>Sign in</h1>
    <p class="intro">
      Halaman login decoy untuk pengujian. Bukan halaman invoice dan tidak memproses kredensial apa pun.
    </p>

    <form class="decoy-form" action="#" method="post">
      <label for="login-email">Email</label>
      <input id="login-email" name="email" type="email" autocomplete="off">
      <label for="login-password">Password</label>
      <input id="login-password" name="password" type="password" autocomplete="off">
      <button type="button">Sign in</button>
    </form>

    <aside class="test-note"><strong>Expected fixture:</strong> URL login termasuk kategori rejected dan harus ditolak <code>sanitize_invoice_url</code>.</aside>
  </main>
</body>
</html>
